name: Publicar Orbi.exe

# Roda quando uma versão nova é marcada (tag v0.1.0, v0.2.0...).
# Monta o Orbi.exe no Windows e publica como Release; o Orbi instalado se atualiza sozinho.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Conferir versão
        shell: python
        run: |
          import os, re
          v = re.search(r'VERSAO = "([^"]+)"', open("orbi/__init__.py", encoding="utf-8").read()).group(1)
          ref = os.environ.get("GITHUB_REF_NAME", "")
          if ref.startswith("v") and ref[1:] != v:
              raise SystemExit(f"Tag {ref} diferente de VERSAO {v} em orbi/__init__.py")
          print("Versão", v)

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Teste rápido (importações)
        run: python -c "import orbi.app, orbi.rotinas, winocr, pyautogui; print('ok')"

      - name: Montar Orbi.exe
        run: >
          pyinstaller --noconfirm --onefile --windowed --name Orbi --icon orbi.ico
          --collect-all winocr --collect-all winrt main.py

      - name: Publicar Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/Orbi.exe
          generate_release_notes: true

      - name: Guardar artefato (execução manual)
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        uses: actions/upload-artifact@v4
        with:
          name: Orbi
          path: dist/Orbi.exe
