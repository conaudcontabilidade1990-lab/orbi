name: Publicar Orbi.exe

# Roda quando a VERSAO em orbi/__init__.py muda no ramo main.
# Monta o Orbi.exe no Windows e publica como Release v<VERSAO>; o Orbi instalado se atualiza sozinho.
on:
  push:
    branches: [main]
    paths: ["orbi/__init__.py"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Ler versão
        id: versao
        shell: python
        run: |
          import os, re
          v = re.search(r'VERSAO = "([^"]+)"', open("orbi/__init__.py", encoding="utf-8").read()).group(1)
          print("Versão", v)
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"v={v}\n")

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt "pyinstaller>=6.9"

      - name: Teste da leitura de números
        run: python tests/test_numeros.py

      - name: Teste dos fluxos das rotinas (Domínio simulado)
        run: python tests/test_fluxo.py

      - name: Teste da janela (login, departamentos, tema, borda) + prints
        run: python tests/test_app.py

      - name: Guardar prints da janela
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prints
          path: prints/

      - name: Teste do login no Firebase do portal
        run: python tests/test_login_firebase.py

      - name: Teste da busca de janelas
        run: python -c "from orbi import janela; l = janela.janelas_visiveis(); print(len(l), 'janelas'); print(janela.achar()[1][:300])"

      - name: Teste do OCR em telas do Domínio
        run: python tests/test_ocr_real.py

      - name: Teste do OCR (Python)
        run: |
          python main.py --testar-ocr
          $c = $LASTEXITCODE
          Get-Content orbi/autoteste_ocr.txt
          exit $c

      - name: Montar Orbi.exe
        run: >
          pyinstaller --noconfirm --onefile --windowed --name Orbi --icon orbi.ico
          --collect-all winrt --collect-all customtkinter --add-data "orbi.ico;." --add-data "orbi/recursos;orbi/recursos" --hidden-import _overlapped --hidden-import asyncio main.py

      - name: Teste do OCR (Orbi.exe)
        run: |
          $p = Start-Process -FilePath dist/Orbi.exe -ArgumentList "--testar-ocr" -Wait -PassThru
          Get-Content dist/autoteste_ocr.txt
          if ($p.ExitCode -ne 0) { exit 1 }
          Remove-Item dist/autoteste_ocr.txt

      - name: Publicar Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.versao.outputs.v }}
          name: Orbi ${{ steps.versao.outputs.v }}
          target_commitish: ${{ github.sha }}
          files: dist/Orbi.exe
          generate_release_notes: true

      - name: Remover ramos temporários de teste
        shell: bash
        run: git push origin --delete diag2 previa visual 2>/dev/null || true

      - name: Guardar artefato
        uses: actions/upload-artifact@v4
        with:
          name: Orbi
          path: dist/Orbi.exe
