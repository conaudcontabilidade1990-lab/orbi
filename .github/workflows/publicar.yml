name: Publicar Orbi.exe

# Roda quando a VERSAO em orbi/__init__.py muda no ramo main.
# Monta o Orbi.exe no Windows e publica como Release v<VERSAO>; o Orbi instalado se atualiza sozinho.
on:
  push:
    branches: [main]
    paths: ["orbi/__init__.py"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Ler versão
        id: versao
        shell: python
        run: |
          import os, re
          v = re.search(r'VERSAO = "([^"]+)"', open("orbi/__init__.py", encoding="utf-8").read()).group(1)
          print("Versão", v)
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"v={v}\n")

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Teste rápido (importações)
        run: python -c "import orbi.app, orbi.rotinas, winocr, pyautogui; print('ok')"

      - name: Montar Orbi.exe
        run: >
          pyinstaller --noconfirm --onefile --windowed --name Orbi --icon orbi.ico
          --collect-all winocr --collect-all winrt main.py

      - name: Publicar Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.versao.outputs.v }}
          name: Orbi ${{ steps.versao.outputs.v }}
          target_commitish: ${{ github.sha }}
          files: dist/Orbi.exe
          generate_release_notes: true

      - name: Guardar artefato
        uses: actions/upload-artifact@v4
        with:
          name: Orbi
          path: dist/Orbi.exe
