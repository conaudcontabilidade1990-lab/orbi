name: Diagnóstico código
on:
  push:
    branches: [diag2]
jobs:
  d:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python diag/codigo.py
